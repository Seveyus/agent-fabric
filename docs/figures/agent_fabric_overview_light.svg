<text x="797.1" y="516.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="start">0.730</text>
<text x="244.0" y="596.0" font-size="16" font-weight="500" fill="#52514e" text-anchor="end">HGT</text>
<text x="244.0" y="615.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">graph model</text>
<line x1="686.3" y1="598" x2="777.7" y2="598" stroke="#c3c2b7" stroke-width="3" stroke-linecap="round"/>
<circle cx="686.3" cy="598" r="7" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2.5"/>
