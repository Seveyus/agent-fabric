<circle cx="753.9" cy="664" r="7" fill="#898781"/>
<text x="244.0" y="728.0" font-size="16" font-weight="500" fill="#52514e" text-anchor="end">LightGBM</text>
<text x="244.0" y="747.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">no graph</text>
<line x1="423.5" y1="730" x2="738.2" y2="730" stroke="#c3c2b7" stroke-width="3" stroke-linecap="round"/>
<circle cx="423.5" cy="730" r="7" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2.5"/>
<circle cx="738.2" cy="730" r="9" fill="#fcfcfb"/>
<circle cx="738.2" cy="730" r="7" fill="#898781"/>
<text x="64.0" y="822.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">The graph models learn from raw interactions what the non-graph models only reach</text>
<text x="64.0" y="844.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">with hand-built history features — and still add a small, significant gain on top.</text>
<rect x="944" y="400" width="286" height="222" rx="16" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="966.0" y="434.0" font-size="11.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">LEARNED, NOT HAND-ENGINEERED</text>
<text x="966" y="492" fill="#0b0b0b"><tspan font-size="44" font-weight="650">+0.043</tspan><tspan font-size="15" font-weight="500" fill="#52514e" dx="8">ROC-AUC</tspan></text>
<text x="966.0" y="528.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">graph vs the same features</text>
<text x="966.0" y="550.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">without message passing</text>
<text x="966.0" y="596.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">paired 95% CI 0.037 – 0.049</text>
<rect x="1250" y="400" width="286" height="222" rx="16" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="1272.0" y="434.0" font-size="11.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">GPU  ·  GTX 1650 LAPTOP</text>
<text x="1272" y="492" fill="#0b0b0b"><tspan font-size="44" font-weight="650">3–5×</tspan><tspan font-size="15" font-weight="500" fill="#52514e" dx="8">faster</tspan></text>
<text x="1272.0" y="528.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">HGT training with the model on</text>
<text x="1272.0" y="550.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">the GPU vs. on the laptop CPU</text>
<text x="1272.0" y="596.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">sampling then = 12–32% of each step</text>
<rect x="944" y="642" width="286" height="222" rx="16" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="966.0" y="676.0" font-size="11.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">INFRASTRUCTURE FINDINGS</text>
<text x="966" y="734" fill="#0b0b0b"><tspan font-size="44" font-weight="650">3</tspan><tspan font-size="15" font-weight="500" fill="#52514e" dx="8">silent bugs</tspan></text>
<text x="966.0" y="770.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">in PyG HGTConv and cuGraph-PyG</text>
<text x="966.0" y="792.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">temporal sampling, reproduced</text>
<text x="966.0" y="838.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">repro scripts + drafted upstream reports</text>
<rect x="1250" y="642" width="286" height="222" rx="16" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="1272.0" y="676.0" font-size="11.5" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">EV FLEET  ·  SYNTHETIC</text>
<text x="1272" y="734" fill="#0b0b0b"><tspan font-size="44" font-weight="650">+0.078</tspan><tspan font-size="15" font-weight="500" fill="#52514e" dx="8">ROC-AUC</tspan></text>
<text x="1272.0" y="770.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">charger &amp; depot contention</text>
<text x="1272.0" y="792.0" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">learned by the same pipeline</text>
<text x="1272.0" y="838.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">paired 95% CI 0.049 – 0.112</text>
<text x="64.0" y="896.0" font-size="13" font-weight="400" fill="#898781" text-anchor="start">github.com/Seveyus/agent-fabric  ·  every number generated from experiments/results/ by docs/figures/make_overview.py</text>
<text x="1536.0" y="896.0" font-size="13" font-weight="400" fill="#898781" text-anchor="end">PyTorch Geometric  ·  cuGraph-PyG  ·  CPU + GPU</text>
