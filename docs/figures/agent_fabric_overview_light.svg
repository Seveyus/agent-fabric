<text x="244.0" y="681.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">no graph</text>
<line x1="401.8" y1="664" x2="753.9" y2="664" stroke="#c3c2b7" stroke-width="3" stroke-linecap="round"/>
