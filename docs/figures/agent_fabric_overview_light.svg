<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="ttl desc">
<title id="ttl">Agent Fabric: temporal graph learning on real GitHub activity</title>
<desc id="desc">Pipeline from GH Archive to a temporal heterogeneous graph and graph models. Test ROC-AUC for predicting whether a pull request is merged within 48 hours: HeteroSAGE 0.721 with PR features only, 0.730 with history features; HGT 0.715 with PR features only, 0.728 with history features; MLP 0.678 with PR features only, 0.724 with history features; LightGBM 0.681 with PR features only, 0.722 with history features.</desc>
<rect width="1600" height="940" fill="#f9f9f7"/>
<rect x="20" y="20" width="1560" height="900" rx="28" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="64.0" y="84.0" font-size="13" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.6">AGENT FABRIC  ·  TEMPORAL HETEROGENEOUS GRAPH LEARNING</text>
<text x="64.0" y="130.0" font-size="36" font-weight="650" fill="#0b0b0b" text-anchor="start">Will this pull request be merged within 48 hours?</text>
<text x="64.0" y="166.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Real public GitHub activity  ·  1.39 M nodes  ·  12.4 M timestamped edges  ·  leakage-safe by construction</text>
<rect x="64.0" y="204" width="262" height="128" rx="14" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="86.0" y="236.0" font-size="12" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">01 · DATA</text>
<text x="86.0" y="264.0" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">GH Archive stream</text>
<text x="86.0" y="290.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">4.6 M events, 3 weeks</text>
<text x="86.0" y="311.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">24,475 collaborative repos</text>
<line x1="334.0" y1="268.0" x2="352.5" y2="268.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M350.5,262.0 L358.5,268.0 L350.5,274.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="366.5" y="204" width="262" height="128" rx="14" fill="#f3f2ef" stroke="#e1e0d9"/>
<rect x="366.5" y="222" width="4" height="92" rx="2" fill="#2a78d6"/>
<text x="388.5" y="236.0" font-size="12" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">02 · GRAPH</text>
<text x="388.5" y="264.0" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">Temporal hetero graph</text>
<text x="388.5" y="290.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">PR · user · repo, 32 relations</text>
<text x="388.5" y="311.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">every edge timestamped</text>
<line x1="636.5" y1="268.0" x2="655.0" y2="268.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M653.0,262.0 L661.0,268.0 L653.0,274.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="669.0" y="204" width="262" height="128" rx="14" fill="#f3f2ef" stroke="#e1e0d9"/>
<rect x="669.0" y="222" width="4" height="92" rx="2" fill="#2a78d6"/>
<text x="691.0" y="236.0" font-size="12" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">03 · NO LEAKAGE</text>
<text x="691.0" y="264.0" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">Time-respecting sampling</text>
<text x="691.0" y="290.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">no edge newer than the PR</text>
<text x="691.0" y="311.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">embargoed splits, tested</text>
<line x1="939.0" y1="268.0" x2="957.5" y2="268.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M955.5,262.0 L963.5,268.0 L955.5,274.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="971.5" y="204" width="262" height="128" rx="14" fill="#f3f2ef" stroke="#e1e0d9"/>
<rect x="971.5" y="222" width="4" height="92" rx="2" fill="#2a78d6"/>
<text x="993.5" y="236.0" font-size="12" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">04 · MODELS</text>
<text x="993.5" y="264.0" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">HeteroSAGE · HGT · JEPA</text>
<text x="993.5" y="290.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">vs LightGBM &amp; MLP baselines</text>
<text x="993.5" y="311.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">same features, same splits</text>
<line x1="1241.5" y1="268.0" x2="1260.0" y2="268.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M1258.0,262.0 L1266.0,268.0 L1258.0,274.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1274.0" y="204" width="262" height="128" rx="14" fill="#f3f2ef" stroke="#e1e0d9"/>
<text x="1296.0" y="236.0" font-size="12" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.2">05 · OUTPUT</text>
<text x="1296.0" y="264.0" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">P(merged within 48 h)</text>
<text x="1296.0" y="290.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">best test ROC-AUC 0.730</text>
<text x="1296.0" y="311.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">3 seeds, paired bootstrap</text>
<line x1="64" y1="368" x2="1536" y2="368" stroke="#e1e0d9"/>
<text x="64.0" y="416.0" font-size="18" font-weight="650" fill="#0b0b0b" text-anchor="start">Test ROC-AUC on 15,000 held-out pull requests</text>
<text x="64.0" y="440.0" font-size="14" font-weight="400" fill="#898781" text-anchor="start">mean of 3 seeds  ·  higher is better</text>
<circle cx="71" cy="469" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="2.5"/>
<text x="86.0" y="474.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">PR features only</text>
<circle cx="241" cy="469" r="7" fill="#898781"/>
<text x="256.0" y="474.0" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">+ point-in-time history features (hand-built)</text>
<line x1="268.0" y1="498" x2="268.0" y2="760" stroke="#e1e0d9"/>
<text x="268.0" y="782.0" font-size="13" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.66</text>
<line x1="419.0" y1="498" x2="419.0" y2="760" stroke="#e1e0d9"/>
<text x="419.0" y="782.0" font-size="13" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.68</text>
<line x1="570.0" y1="498" x2="570.0" y2="760" stroke="#e1e0d9"/>
<text x="570.0" y="782.0" font-size="13" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.70</text>
<line x1="721.0" y1="498" x2="721.0" y2="760" stroke="#e1e0d9"/>
<text x="721.0" y="782.0" font-size="13" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.72</text>
<line x1="872.0" y1="498" x2="872.0" y2="760" stroke="#e1e0d9"/>
<text x="872.0" y="782.0" font-size="13" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.74</text>
<line x1="268" y1="760" x2="872" y2="760" stroke="#c3c2b7"/>
<text x="244.0" y="530.0" font-size="16" font-weight="650" fill="#0b0b0b" text-anchor="end">HeteroSAGE</text>
<text x="244.0" y="549.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">graph model</text>
<line x1="727.1" y1="532" x2="795.1" y2="532" stroke="#86b6ef" stroke-width="3" stroke-linecap="round"/>
<circle cx="727.1" cy="532" r="7" fill="#fcfcfb" stroke="#1c5cab" stroke-width="2.5"/>
