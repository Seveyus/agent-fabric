services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../../storage:/app/storage
    depends_on:
      - postgres
      - redis
      - qdrant
      - ollama

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - ../../.env.example
    volumes:
      - ../../storage:/app/storage
    depends_on:
      - postgres
      - redis
      - qdrant
      - ollama

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentfabric
      POSTGRES_USER: agentfabric
      POSTGRES_PASSWORD: agentfabric
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
