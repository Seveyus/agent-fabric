name: graph-ml

on:
  push:
    paths: ["core/dataset/**", "models/**", "training/**", "benchmarks/**", "configs/**", "tests/ml/**",
            "requirements/graph-cpu.txt", ".github/workflows/graph-ml.yml"]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/graph-cpu.txt
      - name: Install pinned CPU stack (torch 2.8 + PyG 2.7 + pyg-lib)
        run: pip install -r requirements/graph-cpu.txt
      - name: Tests (CPU; the cuGraph test is skipped without a GPU)
        run: python -m pytest tests/ml -q -m "not cugraph"
      - name: Benchmark smoke run (tiny synthetic graph)
        run: python -m benchmarks.sampling_throughput --scales 500 --fanouts 5,3 --batch-sizes 128 --batches 3 --encoders sage --out /tmp/bench
