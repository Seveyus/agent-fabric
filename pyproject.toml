[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fabric"
version = "0.1.0"
description = "Local-first multi-agent execution runtime for project audit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "redis>=5.0.7",
  "httpx>=0.27.0",
  "qdrant-client>=1.10.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "orjson>=3.10.6",
  "tenacity>=8.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "db*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
